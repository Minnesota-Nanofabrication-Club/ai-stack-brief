# Deploys the reading app to GitHub Pages.
#
# SPEC.md, "Deploy composition": Pages serves a tree built as `site/` with
# `briefs/` copied to `site/briefs/`. That is what the compose step below builds,
# and it is why the app can fetch `./briefs/index.json` relatively — same origin,
# no CORS, identical to `python3 scripts/serve.py` locally.
#
# One-time setup by a repo admin: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Without that this workflow fails at the deploy step.
name: Deploy Pages

on:
  push:
    # The repo is not pushed yet and the local clone is on `master` while GitHub
    # defaults new repos to `main`. Both are listed so this fires either way;
    # drop the one you do not use once the default branch is settled.
    branches: [main, master]
    paths:
      - "site/**"
      - "briefs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # daily-brief.yml calls this directly. It has to: a push made with the
  # built-in GITHUB_TOKEN does not fire the `push` trigger above.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. Do not cancel a running deploy — a half-applied
# Pages deployment is worse than a queued one.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Compose and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          # Deploy the current tip of the branch, not the SHA that triggered the
          # run. When daily-brief.yml calls this workflow, the triggering SHA
          # predates the commit that added today's edition.
          ref: ${{ github.ref }}

      - name: Compose the deploy tree
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "::error::site/index.html is missing"; exit 1; }
          test -f briefs/index.json || { echo "::error::briefs/index.json is missing — run scripts/build_index.py"; exit 1; }

          rm -rf _site
          cp -R site _site
          mkdir -p _site/briefs
          cp briefs/*.json _site/briefs/

          # GitHub Pages runs Jekyll on the artifact unless told not to. This repo
          # is plain static files; skip it so nothing gets rewritten or dropped.
          touch _site/.nojekyll

          echo "Deploy tree:"
          find _site -type f | sort | sed 's/^/  /'

      - name: Sanity-check the composed tree
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/briefs/index.json
          python3 -c "import json; json.load(open('_site/briefs/index.json'))"
          echo "OK — ./briefs/index.json resolves next to index.html"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
